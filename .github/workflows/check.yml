name: Check

# Builds and checks every branch except main (main is covered by Release on tags).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build (desktop)
        run: npm run build
      - name: Build (TV, Chromium 85 target)
        run: npx vite build --mode tv
      - uses: actions/upload-artifact@v4
        with:
          name: dist-head
          path: dist
      # The same build of main, so the branch can be compared against it.
      - name: Build main for comparison
        run: |
          git worktree add .base origin/main
          cd .base
          npm ci
          npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-base
          path: .base/dist
          include-hidden-files: true

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev
      # tauri-build checks that bundled resources exist; the real ones are fetched by Release.
      - name: Placeholder resources and frontend
        shell: bash
        run: |
          mkdir -p dist src-tauri/mpv src-tauri/libmpv
          echo '<!doctype html><title>Finplay</title>' > dist/index.html
          touch src-tauri/mpv/.placeholder src-tauri/libmpv/.placeholder
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: |
          cargo test --locked 2>&1 | tee test.log
          echo "::notice title=tests ${{ matrix.platform }}::$(grep 'test result' test.log | tr '\n' ' ')"
      - name: clippy (report only, branch vs main)
        working-directory: src-tauri
        shell: bash
        run: |
          set +e +o pipefail
          cargo clippy --locked --all-targets --message-format=short 2>&1 | grep -E '^src/.*: (warning|error)' | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort > head.txt
          git fetch -q --depth=1 origin main && git worktree add -q ../../.base FETCH_HEAD
          cp -r ../dist ../../.base/ ; mkdir -p ../../.base/src-tauri/mpv ../../.base/src-tauri/libmpv ; touch ../../.base/src-tauri/mpv/.p ../../.base/src-tauri/libmpv/.p
          (cd ../../.base/src-tauri && CARGO_TARGET_DIR=$PWD/../../${{ github.event.repository.name }}/src-tauri/target cargo clippy --locked --all-targets --message-format=short 2>&1 | grep -E '^src/.*: (warning|error)' | sed -E 's/:[0-9]+:[0-9]+:/:/' | sort) > base.txt
          echo "::notice title=clippy ${{ matrix.platform }}::branch $(wc -l < head.txt) warnings, main $(wc -l < base.txt)"
          comm -13 base.txt head.txt | head -8 | while read -r line; do echo "::warning title=new clippy ${{ matrix.platform }}::$line"; done
          comm -23 base.txt head.txt | head -8 | while read -r line; do echo "::notice title=fixed clippy ${{ matrix.platform }}::$line"; done
          exit 0

  # Launches the real desktop app on a virtual display with embedded mpv
  # (FINPLAY_TEST_PLAY), then drives the player over its control socket.
  linux-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev \
            mpv xvfb socat ffmpeg imagemagick libgl1-mesa-dri dbus-x11 jq
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build debug app
        working-directory: src-tauri
        run: cargo build --locked
      - name: Run app with embedded mpv
        shell: bash
        run: |
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=24 -f lavfi -i sine=frequency=440 -t 60 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/test.mp4
          export FINPLAY_TEST_PLAY=/tmp/test.mp4
          cat > /tmp/smoke.sh <<'SH'
          set +e
          ./src-tauri/target/debug/finplay > /tmp/app.log 2>&1 & APP=$!
          SOCK=/tmp/finplay-$APP.sock
          for i in $(seq 1 60); do [ -S $SOCK ] && break; sleep 1; done
          note(){ echo "::notice title=linux smoke::$1"; echo "$1"; }
          [ -S $SOCK ] && note "mpv control socket up after ${i}s" || { note "FAIL no mpv socket"; tail -30 /tmp/app.log; exit 1; }
          q(){ echo "{\"command\":$1,\"request_id\":1}" | socat -t 2 - UNIX-CONNECT:$SOCK | grep '"request_id":1' | head -1 | jq -c .data; }
          sleep 4
          note "embedded with --wid: $(ps -o args= -C mpv | grep -c -- '--wid=')"
          t1=$(q '["get_property","time-pos"]'); sleep 3; t2=$(q '["get_property","time-pos"]')
          note "time-pos advancing: $t1 -> $t2"
          v0=$(q '["get_property","volume"]')
          for k in UP UP UP; do q "[\"keypress\",\"$k\"]" >/dev/null; done; sleep 0.5
          v1=$(q '["get_property","volume"]')
          q '["keypress","DOWN"]' >/dev/null; sleep 0.3; v2=$(q '["get_property","volume"]')
          note "volume via overlay keys: start $v0, after UP x3 $v1, after DOWN $v2"
          for i in $(seq 1 12); do q '["keypress","UP"]' >/dev/null; done; sleep 0.5
          note "volume after 12 more UP (should clamp at 130): $(q '["get_property","volume"]')"
          q '["keypress","SPACE"]' >/dev/null; sleep 0.5; note "paused after SPACE: $(q '["get_property","pause"]')"
          q '["keypress","SPACE"]' >/dev/null; sleep 0.5
          p1=$(q '["get_property","time-pos"]'); q '["keypress","RIGHT"]' >/dev/null; sleep 1; p2=$(q '["get_property","time-pos"]')
          note "seek with RIGHT: $p1 -> $p2"
          import -window root /tmp/screen.png 2>/dev/null
          note "screen colours (blank = 1): $(convert /tmp/screen.png -format %k info: 2>/dev/null)"
          kill -0 $APP && note "app still running" || note "FAIL app exited"
          pgrep -x mpv >/dev/null && note "mpv still running" || note "mpv not running"
          note "app log errors: $(grep -ciE 'error|panic' /tmp/app.log)"
          grep -iE 'error|panic' /tmp/app.log | head -5 | while read -r l; do echo "::notice title=app log::$l"; done
          kill $APP; sleep 2
          pgrep -x mpv >/dev/null && note "FAIL mpv left running after app quit" || note "mpv closed with the app"
          SH
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash /tmp/smoke.sh
