name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MPV_VERSION: v0.41.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
            mpv: ""
          - platform: windows-latest
            args: ""
            rust-target: ""
            mpv: x86_64-w64-mingw32
          # Native runners per arch: libmpv comes from Homebrew, whose
          # libraries match the runner's architecture and macOS version.
          - platform: macos-14
            args: ""
            rust-target: ""
            mpv: ""
          - platform: macos-15-intel
            args: ""
            rust-target: ""
            mpv: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev rpm

      - name: Bundle libmpv (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install mpv dylibbundler
          dest="$GITHUB_WORKSPACE/src-tauri/libmpv"
          mkdir -p "$dest"
          cp "$(brew --prefix mpv)/lib/libmpv.2.dylib" "$dest/"
          chmod u+w "$dest/libmpv.2.dylib"
          install_name_tool -id @loader_path/libmpv.2.dylib "$dest/libmpv.2.dylib"
          # The Vulkan loader finds MoltenVK (the Metal driver) through an ICD
          # manifest, not linking, so bundle both; the app points the loader here.
          cp "$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" "$dest/"
          chmod u+w "$dest/libMoltenVK.dylib"
          install_name_tool -id @loader_path/libMoltenVK.dylib "$dest/libMoltenVK.dylib"
          sed -E 's#"library_path"[^,]*#"library_path": "./libMoltenVK.dylib"#' \
            "$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" > "$dest/MoltenVK_icd.json"
          cat "$dest/MoltenVK_icd.json"
          dylibbundler -of -b -x "$dest/libmpv.2.dylib" -x "$dest/libMoltenVK.dylib" -d "$dest" -p @loader_path/ -s "$(brew --prefix)/lib"
          chmod u+w "$dest"/*.dylib
          # dylibbundler can add @loader_path/ twice; recent dyld refuses to load that.
          for lib in "$dest"/*.dylib; do
            while [[ "$(otool -l "$lib" | grep -A2 LC_RPATH | grep -c '@loader_path/ ')" -gt 1 ]]; do
              install_name_tool -delete_rpath @loader_path/ "$lib"
            done
          done
          codesign --force --sign - "$dest"/*.dylib
          leaked=0
          for lib in "$dest"/*.dylib; do
            if otool -L "$lib" | tail -n +2 | grep -E "$(brew --prefix)|/usr/local/(opt|Cellar|lib)"; then leaked=1; fi
          done
          test "$leaked" = 0
          ls -la "$dest" | head -5
          du -sh "$dest"

      - name: Bundle mpv (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="mpv-$MPV_VERSION-${{ matrix.mpv }}.zip"
          mkdir -p "$RUNNER_TEMP/mpv"
          gh release download "$MPV_VERSION" -R mpv-player/mpv -p "$archive" -D "$RUNNER_TEMP/mpv"
          cd "$RUNNER_TEMP/mpv"
          7z x -y "$archive" > /dev/null
          7z x -y mpv-git-*.zip -o"$GITHUB_WORKSPACE/src-tauri/mpv" > /dev/null
          rm -f "$GITHUB_WORKSPACE"/src-tauri/mpv/*.bat
          test -f "$GITHUB_WORKSPACE/src-tauri/mpv/mpv.exe"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Finplay ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            **Linux:** use the AppImage (updates itself), or the .deb / .rpm, which install mpv for you. With the AppImage, install mpv from your distro.
            **macOS** (14+ on Apple Silicon, 15+ on Intel): pick `aarch64` for Apple Silicon or `x64` for Intel. The player is built in. The app isn't notarized, so the first time macOS blocks it, open System Settings → Privacy & Security and choose Open Anyway.
            **Windows:** mpv is built in. SmartScreen may warn because the installer isn't code-signed; choose More info → Run anyway.

            Windows builds include [mpv](https://mpv.io) ${{ env.MPV_VERSION }} and macOS builds include libmpv and FFmpeg from Homebrew. These are free software under the GPL/LGPL; sources are at https://github.com/mpv-player/mpv and https://ffmpeg.org.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
